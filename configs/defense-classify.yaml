# Mitigation baseline: inference-time input transformations, classification task.
#
# Four transformations plus an undefended control, applied to the image01 tensor
# just before it reaches the vision encoder. No component is retrained -- this is
# the cheapest thing a deployment can actually turn on, and the point is the
# trade-off it buys: clean accuracy cost against robustness gain.
#
#   none    undefended control
#   jpeg75  JPEG re-encode at quality 75
#   blur10  Gaussian blur, sigma 1.0
#   bits3   bit-depth reduction to 3 bits per channel
#   rspad   random resize to 85-100% and pad back to 336 at a random offset
#
# Clean and adversarial rows are the same 256 images: the `imagenette-adv` dataset
# stores the original and the perturbed version of every example, so
# `benchmark.name: imagenette` reads the clean side and `imagenette-adv` the
# attacked side, over an identical sample. The attack is the eps=0.03 encoder-level
# one from the budget sweep, so the `none` rows must reproduce that sweep's eps030
# point -- an internal consistency check worth reading before trusting the table.
#
# Prompt A only. 256 images keeps the whole grid inside a couple of GPU-hours.
#
#   sbatch scripts/run_config.sbatch configs/defense-classify.yaml
#
# Requires configs/budget-sweep-attack.yaml to have completed first.


- output_dir: results/defense/clip-clean-none
  task_type: CLIP-ImageClass
  clip:
    device: auto
  benchmark:
    name: imagenette
    local_path: dataset/imagenette2-320
  batch_size: 256
  limit: 256
  shuffle: true
  seed: 42

- output_dir: results/defense/clip-adv-none
  task_type: CLIP-ImageClass
  clip:
    device: auto
  benchmark:
    name: imagenette-adv
    local_path: results/budget/clip-attack-eps030/dataset
    attack_type: resized
  batch_size: 256
  limit: null
  shuffle: false
  seed: 42

- output_dir: results/defense/clip-clean-jpeg75
