
- output_dir: trials/clip-imagenette-attack-image01
  task_type: CLIP-ImageClass-Attack
  clip:
    device: auto
  benchmark:
    name: imagenette
    local_path: dataset/imagenette2-320
  batch_size: 32
  limit: 1024
  shuffle: true
  seed: 42
  attack:
    space: image01
    train_steps: 20
    eps: 0.03
    lr: 0.006
    label_template: a photo of a {}


