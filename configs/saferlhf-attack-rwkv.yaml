# Universal visual-jailbreak attack against PKU-SafeRLHF, with VisualRWKV-7B as the
# WHITE-BOX target. This is the mirror image of the existing LLaVA attack
# (results/saferlhf_attack) and exists to enable the reverse-direction transfer test:
# attack VisualRWKV here, then evaluate the resulting image on both VisualRWKV
# (white-box) and LLaVA (transfer) with VLM-SafeRLHF-gen / -grade tasks.
#
# Offline / GPU:  sbatch scripts/run_config.sbatch configs/saferlhf-attack-rwkv.yaml
#
# Hyper-parameters are copied from the LLaVA run that produced
# results/saferlhf_attack (cookbook.ipynb, "Adversarial Example for Harmful
# Generations"), so the two attacks are directly comparable:
#     init_image=None (random noise, seeded by `seed`), batch_size=4, limit=64,
#     shuffle=True, seed=42, max_steps=100, lr=0.1, quantize=False (image01 space),
#     save_every=20, and NO eps bound -- the image is only clamped back into [0, 1].
#
# batch_size means the same thing in both implementations (the number of examples
# averaged into one Adam step), but VisualRWKV reaches it by per-example gradient
# accumulation rather than a padded batch: RWKV has no attention mask and
# forward_embeds applies one image span to the whole batch, so variable-length
# SafeRLHF prompts/responses cannot be padded together. The accumulation is exact,
# so the objective is identical -- only peak memory (one example, not four) differs.
# See VisualRWKV.saferlhf_attack for the full argument.
#
# Outputs:
#   results/saferlhf_attack-rwkv/tensors.pt              final image01 (1,3,336,336)
#   results/saferlhf_attack-rwkv/adversarial_image.png   the same, inspectable
#   results/saferlhf_attack-rwkv/checkpoints/            adv_init / adv_step%05d /
#                                                        adv_final (.pt + .png) plus
#                                                        the TensorBoard event file
# The follow-up gen config should point `adv_image` at
# results/saferlhf_attack-rwkv/checkpoints/adv_final.pt.

- output_dir: results/saferlhf_attack-rwkv
  task_type: VLM-SafeRLHF-attack
  vlm:
    name: VisualRWKV
    device: auto
    model_path: ckpt/VisualRWKV-v060-7B-v1.0-20240612.pth
  data_path: PKU-SafeRLHF/data/Alpaca3-8B/train.jsonl
  batch_size: 4
  limit: 64
  shuffle: true
  seed: 42
  attack:
    space: image01        # continuous [0, 1]; 'resized' would attack the uint8 grid via STE
    init_image: null      # random noise seeded by `seed`
    max_steps: 100
    lr: 0.1
    save_every: 20
