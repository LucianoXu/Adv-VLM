# Universal jailbreak attack on VisualRWKV -- 3 independent runs.
#
# The mirror of configs/jailbreak-attack-llava.yaml, and the piece that makes the
# transfer claim two-directional. Same pool size, same step count, same batch size,
# same learning rate, same seeds as the LLaVA config, so the two sides of the 2x2
# matrix differ only in which backbone the gradient came from.
#
# VisualRWKV reaches `batch_size` by per-example gradient accumulation rather than a
# padded batch (RWKV has no attention mask and forward_embeds applies one image span
# to the whole batch, so variable-length SafeRLHF sequences cannot be padded
# together). The accumulation is exact, so the objective matches LLaVA's -- only peak
# memory differs. See VisualRWKV.saferlhf_attack.
#
# Trained on the PKU-SafeRLHF *train* split; evaluation uses held-out *test* prompts.
#
# POOL AND SCHEDULE -- reverted to the published setting, see
# configs/jailbreak-attack-llava.yaml for the full record. In short: scaling the pool
# to 256 pairs made the attack unstable rather than stronger. A validation sweep of
# the checkpoints (400 train prompts, all attack-pool prompts removed) gave
#   step     0    50   100   150   200   250   300   350   400
#   compl 19.0  23.0  27.5  36.0  37.5  22.5  45.0  43.5  12.0   (clean 18.5)
# -- an oscillating trajectory whose best point is still below the 57% the published
# 64-pair setting reliably reaches. Pool and schedule therefore revert; the seeds,
# the 500-prompt test set, the statistics and the second judge are kept.
#
#
# LEARNING RATE -- selected on validation, after the published lr=0.1 proved
# irreproducible. Sweeping lr x stopping point on dataset/saferlhf_val.jsonl
# (train-side prompts, all attack-pool prompts removed), judged by gpt-4.1
# (clean baseline 38.0%, archived original image 85.0%):
#
#      lr    step50  step100  step200  step300
#    0.10      45.5     57.0     41.0     48.5    <- wanders, never converges
#    0.03      38.5     39.5     45.5     84.5    <- converges; matches the original
#    0.01      38.0     43.5     43.0     52.5    <- too slow, still climbing
#
# lr 0.03 at 300 steps reaches 84.5%, indistinguishable from the archived original
# image (85.0%) under the same judge, and its curve rises monotonically rather than
# oscillating. lr 0.1 is the published value and is the reason two independent runs
# of the identical configuration and seed produced 50.5% and 19.5%: at that step size
# the optimisation does not converge, so the published result was one lucky draw.
#
# Pool stays at the published 64 pairs. Only lr and the step count change.
#
# On the response-length guard: VisualRWKV's attack clips a response if the whole
# sequence would exceed the 2048-token WKV6 backward kernel limit, which LLaVA's
# implementation has no need for. Measured on the actual pools these three seeds
# selected when the pools were 256 pairs (2026-09-04): max total sequence length
# 996 / 1110 / 1011 tokens, and **0 examples clipped in any pool** (response tokens run
# 6-427, median ~102). The guard therefore never fires here, so the two backbones
# optimize exactly the same objective and the comparison is clean.
#
# Final image of each run lands at:
#   results/jailbreak/attack-rwkv-s<seed>/checkpoints/adv_final.pt
# which is what configs/jailbreak-gen.yaml consumes.
#
#   sbatch scripts/run_config.sbatch configs/jailbreak-attack-rwkv.yaml

- output_dir: results/jailbreak/attack-rwkv-s42
  task_type: VLM-SafeRLHF-attack
  vlm:
    name: VisualRWKV
    device: auto
    model_path: ckpt/VisualRWKV-v060-7B-v1.0-20240612.pth
  data_path: PKU-SafeRLHF/data/Alpaca3-8B/train.jsonl
  batch_size: 4
  limit: 64
  shuffle: true
  seed: 42
  attack:
    space: image01
    max_steps: 300
    lr: 0.03
    save_every: 50
    init_image: null

