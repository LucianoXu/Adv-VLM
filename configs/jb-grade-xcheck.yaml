# Cross-check judge on the two white-box cells. gpt-4.1 is metered per minute, so this
# runs while the primary judge (gpt-4o-mini) is waiting on its daily quota.
#
# Quantifies grader disagreement on the headline cells. The judge-validation table in
# results/judge-validation/summary.json shows these two graders differ by ~35 points
# of absolute rate on identical text, so reporting the primary number alone would
# overstate how well-determined it is.
- output_dir: results/jailbreak/grade-llava-on-llava-gpt41
  task_type: VLM-SafeRLHF-grade
  generations: results/jailbreak/gen-llava-on-llava/generations.json
  judge:
    name: gpt-4.1-2025-04-14
    workers: 6
    requests_per_minute: 250
    max_retries: 12

- output_dir: results/jailbreak/grade-rwkv-on-rwkv-gpt41
  task_type: VLM-SafeRLHF-grade
  generations: results/jailbreak/gen-rwkv-on-rwkv/generations.json
  judge:
    name: gpt-4.1-2025-04-14
    workers: 6
    requests_per_minute: 250
    max_retries: 12
