# Gate grading uses gpt-4.1, the same judge as the lr sweep, so the gate result is
# directly comparable with the selection table: clean baseline 38.0%, archived
# original image 85.0%, selected setting 84.5% on validation. PASS means landing
# near 85%, not merely above clean. gpt-4o-mini is reserved for the paper's
# reported cells, where its 10k/day cap is the binding constraint.
# Grading for configs/gate-validate.yaml. Login node.
- output_dir: results/gate/grade-llava-s42
  task_type: VLM-SafeRLHF-grade
  generations: results/gate/gen-llava-s42/generations.json
  judge:
    name: gpt-4.1-2025-04-14
    workers: 6
    requests_per_minute: 300

- output_dir: results/gate/grade-rwkv-s42
  task_type: VLM-SafeRLHF-grade
  generations: results/gate/gen-rwkv-s42/generations.json
  judge:
    name: gpt-4.1-2025-04-14
    workers: 6
    requests_per_minute: 300
